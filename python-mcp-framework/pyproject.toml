[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "python-mcp-starter"
version = "0.1.0"
description = "An agent-guided starting point for your own local MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp==2.2.0"]

[project.scripts]
mcp-starter = "usecase_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/usecase_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
