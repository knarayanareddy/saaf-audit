<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HighTable Settings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
                   Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px;
    }

    .container {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08), 0 4px 16px rgba(0,0,0,0.06);
      padding: 36px 40px;
      width: 100%;
      max-width: 480px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .logo-icon {
      font-size: 28px;
      line-height: 1;
    }

    .logo-text {
      font-size: 20px;
      font-weight: 700;
      color: #1a2744;
      letter-spacing: -0.3px;
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
      color: #3a3a3c;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e5e5ea;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #3a3a3c;
      margin-bottom: 6px;
    }

    .field-hint {
      font-size: 11px;
      color: #8e8e93;
      margin-top: 4px;
    }

    input[type="text"],
    input[type="password"],
    input[type="url"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #d1d1d6;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: #1d1d1f;
      background: #fafafa;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }

    input[type="text"]:focus,
    input[type="password"]:focus,
    input[type="url"]:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      background: #ffffff;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #e5e5ea;
    }

    button {
      padding: 9px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      border: none;
      transition: background 0.15s, transform 0.1s;
    }

    #save-btn {
      background: #2563eb;
      color: #ffffff;
    }

    #save-btn:hover { background: #1d4ed8; }
    #save-btn:active { transform: scale(0.97); }

    #status {
      font-size: 13px;
      font-weight: 500;
      color: #16a34a;
      opacity: 0;
      transition: opacity 0.2s;
    }

    #status.visible { opacity: 1; }
    #status.error { color: #dc2626; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <span class="logo-icon">🏛️</span>
      <span class="logo-text">HighTable</span>
    </div>

    <h1>Extension Settings</h1>

    <div class="field">
      <label for="backendUrl">Backend URL</label>
      <input
        type="url"
        id="backendUrl"
        placeholder="http://localhost:8000"
        autocomplete="off"
        spellcheck="false"
      />
      <p class="field-hint">The URL where the HighTable Python backend is running.</p>
    </div>

    <div class="field">
      <label for="backendApiKey">Backend API Key</label>
      <input
        type="password"
        id="backendApiKey"
        placeholder="Leave blank for local dev (no auth)"
        autocomplete="off"
      />
      <p class="field-hint">Matches the <code>BACKEND_API_KEY</code> environment variable. Leave blank if auth is disabled.</p>
    </div>

    <div class="actions">
      <button id="save-btn">Save settings</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
