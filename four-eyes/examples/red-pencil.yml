# Copy this file to .github/workflows/red-pencil.yml in any SAAF agent repo.
# It runs Red Pencil on every push and pull request and fails on high findings.
name: red-pencil

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  red-pencil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Placeholder location until the guard is published under SAAF-Project.
      # Pin to a full commit SHA once published, not a branch name.
      - uses: SAAF-Project/four-eyes@main
        with:
          path: .
          fail-on: high
