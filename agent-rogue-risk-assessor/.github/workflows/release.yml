name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .skill package
        run: |
          mkdir -p dist
          cd skills
          zip -r ../dist/agent-rogue-risk-assessor.skill agent-rogue-risk-assessor -x '*/__pycache__/*' '*.pyc'
          cd ..
          sha256sum dist/agent-rogue-risk-assessor.skill > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/agent-rogue-risk-assessor.skill
            dist/SHA256SUMS
