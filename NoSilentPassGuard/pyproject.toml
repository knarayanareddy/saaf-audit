[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "no-silent-pass"
version = "0.1.0"
description = "Black Knight: a deterministic guard. 'Nothing detected' is NOT_ASSESSED, never PASS."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
black-knight = "no_silent_pass.cli:main"
no-silent-pass = "no_silent_pass.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
