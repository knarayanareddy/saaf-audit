# Example GitHub Actions workflow: run the SAAF agent scanner on every pull request (read-only).
# Copy to .github/workflows/saaf-scan.yml in a SAAF repository. Pin SCANNER_REF to a reviewed commit SHA.
name: saaf-scan
on:
  pull_request:          # NOT pull_request_target: untrusted PR code never runs with secrets
  workflow_dispatch:
permissions:
  contents: read         # read-only; the scanner never needs write access or secrets
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2, pinned by SHA
        with:
          fetch-depth: 0       # full history for the secrets-in-history check
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: SAAF-Project/saaf-agent-scanner   # where this kit is published
          ref: ${{ vars.SCANNER_REF }}                   # set to a commit SHA in repo/org variables
          path: .saaf-scanner
          persist-credentials: false
      - name: Scan (stdlib only, no install)
        run: python3 -I .saaf-scanner/saaf_scan.py . --history --out saaf-scan-out --fail-on High
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: saaf-scan
          path: saaf-scan-out/
