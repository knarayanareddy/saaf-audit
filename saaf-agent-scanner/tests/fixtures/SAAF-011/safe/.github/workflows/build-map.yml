name: Build map
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python -m unittest discover tests
  release:
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: example-org/shared-ci/.github/workflows/release.yml@0123456789abcdef0123456789abcdef01234567
  guard:
    runs-on: ubuntu-latest
    steps:
      - run: |
          git clone https://github.com/example-org/guard.git "$RUNNER_TEMP/guard"
          git -C "$RUNNER_TEMP/guard" checkout 0123456789abcdef0123456789abcdef01234567
          python "$RUNNER_TEMP/guard/check.py"
